name: Pull Request Checks

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  DOTNET_VERSION: 10.0.x

jobs:

  CI:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore

    - name: Build Solution
      run: dotnet build --no-restore

    - name: Run Tests
      run: dotnet test --no-build --verbosity normal

  code_style_checks:
    name: Code style checks
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Build Solution
      id: build
      run: |
        dotnet restore
        dotnet build --no-restore

    - name: Dotnet Format Checks (Whitespaces)
      if: steps.build.outcome == 'success'
      run: |
        dotnet format whitespace --no-restore --verify-no-changes

    - name: Dotnet Format Checks (Style)
      if: steps.build.outcome == 'success'
      run: |
        dotnet format style --no-restore --verify-no-changes

    - name: Dotnet Format Checks (Analizers)
      if: steps.build.outcome == 'success'
      run: |
        dotnet format analyzers --no-restore --verify-no-changes
